name: CMIS Family 170 Original Ramsey Targets
# AI-assisted engineering. Two original statements; each needs its own audited receipt.
on:
  push:
    branches: [cmis-family170-cp46-20261022]
    paths: ['.github/workflows/family170-original-targets-cp46.yml']
permissions:
  contents: read
jobs:
  verify:
    name: Original Family 170 - ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: ramsey_five
            config: RamseyFive
            module: OAI.Combinatorics.RamseyFive.Main
            declaration: OAI.SharpRamseyFive.main
            config_blob: 7a2fb30b864b78af93d8e28cc8293cabe4d81a53
            challenge_blob: 783fa994079892d567045b968487655b9ca20dcc
            solution_path: lean/OAI/Combinatorics/RamseyFive/Main.lean
            solution_blob: aa552a79bd96916e70578ef9975665b40045ad2b
          - label: sharp_log_ramsey
            config: SharpLogRamsey
            module: OAI.Combinatorics.SharpRamsey.Main
            declaration: OAI.SharpLogRamsey.main
            config_blob: edc379f2dc405744108216a889c034683e385e50
            challenge_blob: 0e9f633cf8b6d93794e79d1fe1b05c9d2a9e1b1c
            solution_path: lean/OAI/Combinatorics/SharpRamsey/Main.lean
            solution_blob: 7f055ba49c2d72958422e3ec7077904b4817168b
    env:
      EXECUTION_MODE: full
      OPENAI_MATH_COMMIT: fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb
      LEAN_VERSION: 4.34.1
      LEAN_ASSET_URL: https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst
      LEAN_ASSET_SHA256: 47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4
      COMPARATOR_COMMIT: d03acab154d269c06e60e4de7e4cc85deebff94b
      LEAN4EXPORT_COMMIT: 076e8e57707e813375e8f9da8bf989799ace9680
      LANDRUN_COMMIT: ec104f6edc1e14d7fec6d31146f1ec6f9c192c5a
      MATHLIB_COMMIT: d13f23b723b8a846827a245b89c10fc7d3f11612
      CONFIG_BLOB: 4a045e5a5b2d3879ea54f5d6a790869a70d36da1
      CHALLENGE_BLOB: b2cf871bc3bb38194fc1b742666210f11498918b
      SOLUTION_BLOB: d72f424a9e90900da6e5f35ba4f486287eadf342
      CMIS_VERIFICATION_TIMEOUT_SECONDS: 19800
      TARGET_LABEL: ${{ matrix.label }}
      CONFIG_SOURCE_PATH: lean/ComparatorChallenges/${{ matrix.config }}.json
      CONFIG_RUNTIME_PATH: ComparatorChallenges/${{ matrix.config }}.json
      TARGET_CONFIG_BLOB: ${{ matrix.config_blob }}
      CHALLENGE_SOURCE_PATH: lean/ComparatorChallenges/${{ matrix.config }}.lean
      TARGET_CHALLENGE_BLOB: ${{ matrix.challenge_blob }}
      SOLUTION_SOURCE_PATH: ${{ matrix.solution_path }}
      TARGET_SOLUTION_BLOB: ${{ matrix.solution_blob }}
      SOLUTION_MODULE: ${{ matrix.module }}
      SELECTED_THEOREM: ${{ matrix.declaration }}
      AXIOM_IMPORT_MODULE: ${{ matrix.module }}
      AXIOM_DECLARATIONS: ${{ matrix.declaration }}
    steps:
      - name: Check out the public execution harness
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        timeout-minutes: 3
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.0'
          cache: false
      - name: Run the original configuration under the bounded harness
        id: formal
        timeout-minutes: 335
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object scripts/run_family167_bounded_target.sh)" = 4f9f1ddb384ddd77c39a9a7203d8625a5f93b9ed
          bash scripts/run_family167_bounded_target.sh
      - name: Finalize execution receipt
        id: finalize
        timeout-minutes: 2
        if: always()
        shell: bash
        env:
          FORMAL_STEP_OUTCOME: ${{ steps.formal.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p cmis_receipt
          fail() {
            trap - ERR
            printf '%s\n' RECEIPT_FINALIZATION_HOLD > cmis_receipt/FINAL_STATUS.txt || true
            rm -f cmis_receipt/99_receipt_sha256.txt || true
            exit 4
          }
          trap fail ERR
          test -f cmis_receipt/FINAL_STATUS.txt || echo RECEIPT_MISSING > cmis_receipt/FINAL_STATUS.txt
          {
            echo "formal_step_outcome=$FORMAL_STEP_OUTCOME"
            echo "target_label=$TARGET_LABEL"
            echo "run_id=$GITHUB_RUN_ID"
            echo "harness_commit=$GITHUB_SHA"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > cmis_receipt/98_workflow_outcome.txt
          manifest=$(mktemp "$RUNNER_TEMP/cmis170-manifest.XXXXXX")
          (cd cmis_receipt && find . -maxdepth 1 -type f ! -name 99_receipt_sha256.txt -print0 | sort -z | xargs -0 sha256sum > "$manifest")
          mv "$manifest" cmis_receipt/99_receipt_sha256.txt
      - name: Upload the separate immutable receipt
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmis-family170-${{ matrix.label }}-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: cmis_receipt/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Enforce fail-closed mathematical outcome
        timeout-minutes: 1
        if: always()
        shell: bash
        env:
          FORMAL_STEP_OUTCOME: ${{ steps.formal.outcome }}
          FINALIZE_STEP_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          set -Eeuo pipefail
          test "$FORMAL_STEP_OUTCOME:$FINALIZE_STEP_OUTCOME" = success:success
          test "$(cat cmis_receipt/FINAL_STATUS.txt)" = PASS_SELECTED_THEOREM
          grep -F 'Lean default kernel accepts the solution' cmis_receipt/04_comparator.stdout
          grep -F 'Your solution is okay!' cmis_receipt/04_comparator.stdout
          test -s cmis_receipt/99_receipt_sha256.txt
