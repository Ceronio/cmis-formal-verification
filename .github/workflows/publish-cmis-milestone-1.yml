name: Publish CMIS Formal Verification Milestone 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cmis-milestone-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish completed CMIS verification register
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Write public catalogue and release documents
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          files = {
              'README.md': '',
              'COMPLETED_VERIFICATIONS.md': '',
              'SCOPE_AUDITS.md': '',
              'METHODOLOGY.md': '',
              'EXECUTION_HOLDS.md': '',
              'verification-register.json': '',
              'CITATION.cff': '',
              'SHA256SUMS.txt': '',
              'releases/CMIS_FORMAL_VERIFICATION_MILESTONE_1.md': '',
          }

          for relative_path, encoded in files.items():
              path = Path(relative_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              payload = base64.b64decode(encoded)
              path.write_bytes(payload)
              print(f"wrote {relative_path} ({len(payload)} bytes)")
          PY

      - name: Commit living public register
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "CMIS Release Bot"
          git config user.email "68863747+Ceronio@users.noreply.github.com"
          git add README.md \
                  COMPLETED_VERIFICATIONS.md \
                  SCOPE_AUDITS.md \
                  METHODOLOGY.md \
                  EXECUTION_HOLDS.md \
                  verification-register.json \
                  CITATION.cff \
                  SHA256SUMS.txt \
                  releases/CMIS_FORMAL_VERIFICATION_MILESTONE_1.md
          if git diff --cached --quiet; then
            echo "Public register already current."
          else
            git commit -m "Publish CMIS Milestone 1 verification register"
            git push origin HEAD:main
          fi

      - name: Build public release pack
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist/CMIS_Formal_Verification_Milestone_1
          cp README.md \
             COMPLETED_VERIFICATIONS.md \
             SCOPE_AUDITS.md \
             METHODOLOGY.md \
             EXECUTION_HOLDS.md \
             verification-register.json \
             PINS.md \
             CITATION.cff \
             SHA256SUMS.txt \
             dist/CMIS_Formal_Verification_Milestone_1/
          cp releases/CMIS_FORMAL_VERIFICATION_MILESTONE_1.md \
             dist/CMIS_Formal_Verification_Milestone_1/RELEASE_NOTES.md
          (
            cd dist
            zip -9 -r CMIS_Formal_Verification_Milestone_1_v0.1.0.zip \
              CMIS_Formal_Verification_Milestone_1
            sha256sum CMIS_Formal_Verification_Milestone_1_v0.1.0.zip \
              > CMIS_Formal_Verification_Milestone_1_v0.1.0.sha256
          )

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
          TITLE: CMIS Formal Verification Milestone 1
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file releases/CMIS_FORMAL_VERIFICATION_MILESTONE_1.md
            gh release upload "$TAG" \
              dist/CMIS_Formal_Verification_Milestone_1_v0.1.0.zip \
              dist/CMIS_Formal_Verification_Milestone_1_v0.1.0.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              dist/CMIS_Formal_Verification_Milestone_1_v0.1.0.zip \
              dist/CMIS_Formal_Verification_Milestone_1_v0.1.0.sha256 \
              --target "$TARGET_SHA" \
              --title "$TITLE" \
              --notes-file releases/CMIS_FORMAL_VERIFICATION_MILESTONE_1.md
          fi

      - name: Confirm release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release view v0.1.0 --json tagName,name,url,isDraft,isPrerelease
