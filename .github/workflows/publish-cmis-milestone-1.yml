name: Publish CMIS Formal Verification Milestone 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cmis-milestone-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Package and publish corrected Milestone 1 register
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Recompute publication checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum \
            README.md \
            COMPLETED_VERIFICATIONS.md \
            SCOPE_AUDITS.md \
            METHODOLOGY.md \
            EXECUTION_HOLDS.md \
            verification-register.json \
            PINS.md \
            CITATION.cff \
            releases/CMIS_FORMAL_VERIFICATION_MILESTONE_1.md \
            > SHA256SUMS.txt
          git config user.name "CMIS Release Bot"
          git config user.email "68863747+Ceronio@users.noreply.github.com"
          git add SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Checksums already current."
          else
            git commit -m "Refresh CMIS Milestone 1 checksums"
            git push origin HEAD:main
          fi

      - name: Validate publication files
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in README.md COMPLETED_VERIFICATIONS.md SCOPE_AUDITS.md METHODOLOGY.md EXECUTION_HOLDS.md verification-register.json PINS.md CITATION.cff SHA256SUMS.txt releases/CMIS_FORMAL_VERIFICATION_MILESTONE_1.md; do
            test -s "$file"
          done
          python3 -m json.tool verification-register.json >/dev/null
          grep -Fq 'Formal theorem declarations passed | **42**' README.md
          grep -Fq 'Selected formal theorem declarations passed | **42**' COMPLETED_VERIFICATIONS.md
          sha256sum -c SHA256SUMS.txt

      - name: Build public release pack
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf dist
          mkdir -p dist/CMIS_Formal_Verification_Milestone_1
          cp README.md COMPLETED_VERIFICATIONS.md SCOPE_AUDITS.md METHODOLOGY.md EXECUTION_HOLDS.md verification-register.json PINS.md CITATION.cff SHA256SUMS.txt dist/CMIS_Formal_Verification_Milestone_1/
          cp releases/CMIS_FORMAL_VERIFICATION_MILESTONE_1.md dist/CMIS_Formal_Verification_Milestone_1/RELEASE_NOTES.md
          (
            cd dist
            zip -9 -r CMIS_Formal_Verification_Milestone_1_v0.1.0.zip CMIS_Formal_Verification_Milestone_1
            sha256sum CMIS_Formal_Verification_Milestone_1_v0.1.0.zip > CMIS_Formal_Verification_Milestone_1_v0.1.0.sha256
          )

      - name: Replace Milestone 1 release with corrected snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release delete v0.1.0 --cleanup-tag --yes
          fi
          gh release create v0.1.0 \
            dist/CMIS_Formal_Verification_Milestone_1_v0.1.0.zip \
            dist/CMIS_Formal_Verification_Milestone_1_v0.1.0.sha256 \
            --target "$(git rev-parse HEAD)" \
            --title "CMIS Formal Verification Milestone 1" \
            --notes-file releases/CMIS_FORMAL_VERIFICATION_MILESTONE_1.md

      - name: Confirm release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release view v0.1.0 --json tagName,name,url,isDraft,isPrerelease,targetCommitish
