name: CMIS Family 159 small-closure resource experiment
# AI-assisted engineering, not mathematical verification. Never awards proof credit.
on:
  push:
    branches: [cmis-family159-remediation-20261022]
    paths: ['.github/workflows/family159-small-closure-profile.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      EXECUTION_MODE: admission
      OPENAI_MATH_COMMIT: fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb
      LEAN_VERSION: 4.34.1
      LEAN_ASSET_URL: https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst
      LEAN_ASSET_SHA256: 47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4
      COMPARATOR_COMMIT: d03acab154d269c06e60e4de7e4cc85deebff94b
      LEAN4EXPORT_COMMIT: 076e8e57707e813375e8f9da8bf989799ace9680
      LANDRUN_COMMIT: ec104f6edc1e14d7fec6d31146f1ec6f9c192c5a
      MATHLIB_COMMIT: d13f23b723b8a846827a245b89c10fc7d3f11612
      CONFIG_BLOB: 4a045e5a5b2d3879ea54f5d6a790869a70d36da1
      CHALLENGE_BLOB: b2cf871bc3bb38194fc1b742666210f11498918b
      SOLUTION_BLOB: d72f424a9e90900da6e5f35ba4f486287eadf342
      SELECTED_THEOREM: OAI.Erdos3.manuscriptReciprocalProgressionTheorem
    steps:
      - name: Checkout engineering harness
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Go for admitted Landrun
        timeout-minutes: 2
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.0'
          cache: false
      - name: Prepare exact existing tool and dependency environment only
        timeout-minutes: 9
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object scripts/run_family132_github_actions.sh)" = 84415eae7efc28b447307a598828292f67398923
          timeout --signal=TERM --kill-after=30s 480s bash scripts/run_family132_github_actions.sh
          test "$(cat cmis_receipt/FINAL_STATUS.txt)" = ADMISSION_PASS
      - name: Profile small original closure with real resource counters
        timeout-minutes: 17
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/profile_family159_small_closure.py
          python3 scripts/profile_family159_small_closure.py
      - name: Seal engineering evidence
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p family159_small_closure_profile
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          out=Path('family159_small_closure_profile')
          if Path('cmis_receipt').exists():shutil.copytree('cmis_receipt',out/'admission',dirs_exist_ok=False)
          metadata={'kind':'ENGINEERING_ONLY','formal_credit':0,'run_id':os.environ['GITHUB_RUN_ID'],
            'harness_commit':os.environ['GITHUB_SHA'],'full_theorem_run':False,'paid_runner':False,
            'solution_cache_reused':False,'note':'Original dependency cache reused; cold project build outputs relocated before each proxy trial.'}
          (out/'RUN_METADATA.json').write_text(json.dumps(metadata,indent=2)+'\n')
          files=[{'path':str(p.relative_to(out)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p.name!='MANIFEST.json']
          (out/'MANIFEST.json').write_text(json.dumps({'files':files},indent=2)+'\n')
          PY
      - name: Upload engineering logs and metrics, no compiled proof cache
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmis-family159-small-closure-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: family159_small_closure_profile/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
