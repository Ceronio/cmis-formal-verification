name: CMIS CP75 — nine-circle tensor determinant and original source audit

on:
  push:
    branches: [cmis-family172-cp75-nine-point-20261028]
    paths:
      - 'research/cp75/**'
      - '.github/workflows/cmis-family172-cp75-independent-review.yml'
  pull_request:
    paths:
      - 'research/cp75/**'
      - '.github/workflows/cmis-family172-cp75-independent-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded_research:
    name: CP75 50 exact tests, independent tensor grid, 20 pinned sources (NO theorem credit)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact audit branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record execution provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p research/cp75/receipt
          python3 --version | tee research/cp75/receipt/PYTHON_VERSION.txt
          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner=$RUNNER_OS"
            echo "source=public OpenAI Mathematics fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb"
            echo "selected_theorem=OAI.EuclideanRamsey.NineStatement.nine_circle_configuration"
            echo "theorem_admission=SEPARATE_COMPARATOR_RUN"
          } > research/cp75/receipt/EXECUTION_IDENTITY.txt
      - name: Compile and run 50 adversarial exact arithmetic checks
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile research/cp75/nine_point_math.py research/cp75/test_cp75.py research/cp75/verify_pinned_sources.py
          python3 -m unittest discover -s research/cp75 -p test_cp75.py -v 2>&1 | tee research/cp75/receipt/UNIT_TEST_LOG.txt
          grep -q 'Ran 50 tests' research/cp75/receipt/UNIT_TEST_LOG.txt
          grep -q '^OK$' research/cp75/receipt/UNIT_TEST_LOG.txt
      - name: Execute original 9x9 grid determinant and 18-variable specialization counterchecks
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/cp75/nine_point_math.py --output research/cp75/receipt/MATH_AUDIT.json | tee research/cp75/receipt/MATH_STDOUT.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/cp75/receipt/MATH_AUDIT.json").read_text())
          assert d["status"]=="PASS_CP75_EXACT_BOUNDED_AND_SYMBOLIC_SPECIALIZATION"
          assert d["grid"]["Kronecker_cleared_det"]=="262144"
          assert d["grid"]["Kronecker_rational_det"]=="64"
          assert d["grid"]["denominator_product"]=="4096"
          assert len(d["grid"]["all_evaluation_rows"])==9
          assert d["random_rational_specializations"]["sample_assignments"]==56
          assert d["diagonal_negative_control"]["nine_rational_points_rank"]==5
          assert d["diagonal_negative_control"]["algebraic_independence_not_met"] is True
          assert d["whole_family_172_validated"] is False and d["additional_whole_family_credit"]==0
          assert d["formal_selected_theorem"]=="SEPARATE_GITHUB_LEAN_COMPARATOR"
          PY
      - name: Authenticate twenty immutable original publisher objects and theorem scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 research/cp75/verify_pinned_sources.py --output-dir research/cp75/receipt | tee research/cp75/receipt/SOURCE_STDOUT.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/cp75/receipt/SOURCE_VALIDATION.json").read_text())
          assert p["status"]=="PASS_CP75_20_PINNED_SOURCE_OBJECTS_AND_CLAIM_SCOPE"
          assert p["sources_checked"]==20
          assert p["scope_contract"]["source_audit_is_not_theorem_admission"] is True
          assert p["whole_family_validated"] is False
          assert p["external_certification"]=="DEFERRED"
          PY
      - name: Seal source and receipt hashes with explicit limited claim
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'PASS_CP75_BOUNDED_GRID_AND_PINNED_SOURCES\n' > research/cp75/receipt/FINAL_STATUS.txt
          printf 'ORIGINAL_NINE_CIRCLE_THEOREM_SEPARATE_PINNED_COMPARATOR\n' > research/cp75/receipt/FORMAL_STATUS.txt
          (cd research/cp75 &&
            sha256sum nine_point_math.py test_cp75.py verify_pinned_sources.py SOURCE_PINS.json INDEPENDENT_MATHEMATICAL_NOTE.md README.md > receipt/RESEARCH_CODE_SHA256.txt)
          (cd research/cp75/receipt &&
            find . -type f ! -name SHA256SUMS.txt ! -name SHA256_VERIFICATION.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt &&
            sha256sum -c SHA256SUMS.txt | tee SHA256_VERIFICATION.txt)
      - name: Upload full public mathematics, scripts and pinned source proof records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmis-cp75-bounded-nine-circle-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/cp75/
            !research/cp75/__pycache__/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Fail closed against unsupported formal theorem credit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat research/cp75/receipt/FINAL_STATUS.txt)" = PASS_CP75_BOUNDED_GRID_AND_PINNED_SOURCES
          test "$(cat research/cp75/receipt/FORMAL_STATUS.txt)" = ORIGINAL_NINE_CIRCLE_THEOREM_SEPARATE_PINNED_COMPARATOR
          echo "PASS on bounded mathematics and original sources only. Selected theorem formal status is a separate original Lean/Comparator run." >> "$GITHUB_STEP_SUMMARY"
