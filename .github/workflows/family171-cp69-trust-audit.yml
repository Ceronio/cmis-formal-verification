name: CMIS Family 171 CP69 target trust and axiom audit
on:
  push:
    branches: [cmis-family171-cp66-cp70-formal-target]
    paths: ['.github/workflows/family171-cp69-trust-audit.yml']
permissions:
  contents: read
jobs:
  trust_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENAI_MATH_COMMIT: fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb
      LEAN_VERSION: 4.34.1
      LEAN_ASSET_URL: https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst
      LEAN_ASSET_SHA256: 47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4
      MATHLIB_COMMIT: d13f23b723b8a846827a245b89c10fc7d3f11612
    steps:
      - name: Check out public formal-target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Audit static trust boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p cp69_receipt
          spec=formal/family171/Family171FullTarget.lean
          ledger=formal/family171/formalization_obligations.json
          test -f "$spec"
          test -f "$ledger"
          if grep -En '\b(sorry|admit|axiom|unsafe)\b' "$spec"; then
            echo 'Forbidden proof/trust token found.' >&2
            exit 2
          fi
          jq -e '.positive_target_proved == false and .formal_credit == 0' "$ledger"
          jq -e '[.obligations[].status] | index("not_formalized") != null' "$ledger"
          test "$(grep -c '^def FullHypercubeRamseyLinearBound' "$spec")" = 1
          test "$(grep -c '^theorem fullTarget_iff_sourceStatement' "$spec")" = 1
          test "$(grep -c '^theorem negatedInterface_iff_sourceHypothesis' "$spec")" = 1
      - name: Install pinned Lean and public source
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git jq zstd >/dev/null
          mkdir -p .cp69/tools .cp69/source
          curl --fail --location --retry 5 --retry-all-errors "$LEAN_ASSET_URL" -o .cp69/lean.tar.zst
          printf '%s  %s\n' "$LEAN_ASSET_SHA256" .cp69/lean.tar.zst | sha256sum -c -
          tar --zstd -xf .cp69/lean.tar.zst -C .cp69/tools
          LEAN_HOME=$(find .cp69/tools -maxdepth 1 -mindepth 1 -type d -name "lean-${LEAN_VERSION}-linux" -print -quit)
          test -n "$LEAN_HOME"
          LEAN_HOME="$PWD/$LEAN_HOME"
          export PATH="$LEAN_HOME/bin:$PATH"
          echo "LEAN_HOME=$LEAN_HOME" >> "$GITHUB_ENV"
          echo "$LEAN_HOME/bin" >> "$GITHUB_PATH"
          git -C .cp69/source init
          git -C .cp69/source remote add origin https://github.com/openai/math.git
          git -C .cp69/source fetch --depth=1 origin "$OPENAI_MATH_COMMIT"
          git -C .cp69/source checkout --detach FETCH_HEAD
          test "$(git -C .cp69/source rev-parse HEAD)" = "$OPENAI_MATH_COMMIT"
          test "$(jq -r '.packages[] | select(.name=="mathlib") | .rev' .cp69/source/lean/lake-manifest.json)" = "$MATHLIB_COMMIT"
          lean --version | tee cp69_receipt/LEAN_VERSION.txt
          lake --version | tee cp69_receipt/LAKE_VERSION.txt
      - name: Build the pinned module, typecheck, and inspect interface axioms
        timeout-minutes: 70
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .cp69/source/lean
          before=$(sha256sum lake-manifest.json)
          lake update | tee "$GITHUB_WORKSPACE/cp69_receipt/LAKE_UPDATE.log"
          after=$(sha256sum lake-manifest.json)
          test "$before" = "$after"
          lake exe cache get | tee "$GITHUB_WORKSPACE/cp69_receipt/CACHE_GET.log"
          lake build OAI.Combinatorics.Ramsey.Hypercube 2>&1 | tee "$GITHUB_WORKSPACE/cp69_receipt/OAI_HYPERCUBE_BUILD.log"
          mkdir -p CMIS
          cp "$GITHUB_WORKSPACE/formal/family171/Family171FullTarget.lean" CMIS/Family171FullTarget.lean
          set +e
          lake env lean CMIS/Family171FullTarget.lean \
            > "$GITHUB_WORKSPACE/cp69_receipt/LEAN_AXIOMS.txt" \
            2> "$GITHUB_WORKSPACE/cp69_receipt/LEAN_STDERR.txt"
          lean_rc=$?
          set -e
          printf '%s\n' "$lean_rc" > "$GITHUB_WORKSPACE/cp69_receipt/LEAN_EXIT_CODE.txt"
          test "$lean_rc" -eq 0
          grep -Ev "^warning: [^:]+: repository '.*' has local changes$|^[[:space:]]*$" \
            "$GITHUB_WORKSPACE/cp69_receipt/LEAN_STDERR.txt" \
            > "$GITHUB_WORKSPACE/cp69_receipt/UNEXPECTED_STDERR.txt" || true
          test ! -s "$GITHUB_WORKSPACE/cp69_receipt/UNEXPECTED_STDERR.txt"
          printf '%s\n' EXPECTED_COMPATIBILITY_WARNINGS_ONLY \
            > "$GITHUB_WORKSPACE/cp69_receipt/STDERR_CLASSIFICATION.txt"
          if grep -F 'sorryAx' "$GITHUB_WORKSPACE/cp69_receipt/LEAN_AXIOMS.txt"; then
            echo 'sorryAx found in target interface.' >&2
            exit 2
          fi
          grep -F "'CMIS.Family171.fullTarget_iff_sourceStatement' depends on axioms: [propext, Classical.choice, Quot.sound]" \
            "$GITHUB_WORKSPACE/cp69_receipt/LEAN_AXIOMS.txt"
          grep -F "'CMIS.Family171.negatedInterface_iff_sourceHypothesis' depends on axioms: [propext, Classical.choice, Quot.sound]" \
            "$GITHUB_WORKSPACE/cp69_receipt/LEAN_AXIOMS.txt"
      - name: Seal CP69 trust receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          out=Path('cp69_receipt'); out.mkdir(exist_ok=True)
          spec=Path('formal/family171/Family171FullTarget.lean')
          rc=(out/'LEAN_EXIT_CODE.txt').read_text().strip() if (out/'LEAN_EXIT_CODE.txt').exists() else 'missing'
          ax=(out/'LEAN_AXIOMS.txt').read_text(errors='replace') if (out/'LEAN_AXIOMS.txt').exists() else ''
          build=(out/'OAI_HYPERCUBE_BUILD.log').read_text(errors='replace') if (out/'OAI_HYPERCUBE_BUILD.log').exists() else ''
          unexpected=out/'UNEXPECTED_STDERR.txt'
          exact=(
            "'CMIS.Family171.fullTarget_iff_sourceStatement' depends on axioms: [propext, Classical.choice, Quot.sound]" in ax and
            "'CMIS.Family171.negatedInterface_iff_sourceHypothesis' depends on axioms: [propext, Classical.choice, Quot.sound]" in ax
          )
          ok=(
            rc=='0' and 'Build completed successfully' in build and unexpected.exists() and
            unexpected.stat().st_size==0 and 'sorryAx' not in ax and exact
          )
          status='TARGET_INTERFACE_TRUST_PASS' if ok else 'TARGET_INTERFACE_TRUST_HOLD'
          result={
            'status':status,
            'kind':'TARGET_INTERFACE_TRUST_ONLY',
            'mathematical_credit':0,
            'positive_target_proved':False,
            'source_commit':os.environ['OPENAI_MATH_COMMIT'],
            'branch_commit':os.environ['GITHUB_SHA'],
            'spec_sha256':hashlib.sha256(spec.read_bytes()).hexdigest(),
            'lean_exit_code':rc,
            'sorryAx_absent':'sorryAx' not in ax,
            'pinned_source_module_built':'Build completed successfully' in build,
            'expected_warnings_only':unexpected.exists() and unexpected.stat().st_size==0,
            'interface_axioms_exact':exact,
            'full_proof_obligations_open':True,
          }
          (out/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          (out/'FINAL_STATUS.txt').write_text(status+'\n')
          PY
          (cd cp69_receipt && find . -maxdepth 1 -type f ! -name 99_receipt_sha256.txt -print0 | sort -z | xargs -0 sha256sum > 99_receipt_sha256.txt)
      - name: Upload CP69 trust receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmis-family171-cp69-trust-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: cp69_receipt/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Enforce trust-only success
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat cp69_receipt/FINAL_STATUS.txt)" = TARGET_INTERFACE_TRUST_PASS
          grep -F '"mathematical_credit": 0' cp69_receipt/RESULT.json
          grep -F '"positive_target_proved": false' cp69_receipt/RESULT.json
          grep -F '"pinned_source_module_built": true' cp69_receipt/RESULT.json
          grep -F '"expected_warnings_only": true' cp69_receipt/RESULT.json
          grep -F '"interface_axioms_exact": true' cp69_receipt/RESULT.json
          grep -F '"full_proof_obligations_open": true' cp69_receipt/RESULT.json
