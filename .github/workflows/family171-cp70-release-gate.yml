name: CMIS Family 171 CP70 GitHub completion and release gate
on:
  push:
    branches: [cmis-family171-cp66-cp70-formal-target]
    paths: ['.github/workflows/family171-cp70-release-gate.yml']
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  release_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the public completion branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate the completion ledger and static trust boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p cp70_receipt
          ledger=formal/family171/CP70_GITHUB_COMPLETION.json
          spec=formal/family171/Family171FullTarget.lean
          obligations=formal/family171/formalization_obligations.json
          jq -e '.positive_target_proved == false and .formal_credit == 0 and .full_proof_obligations_open == true' "$ledger"
          jq -e '.positive_target_proved == false and .formal_credit == 0' "$obligations"
          test "$(jq -r '.final_gates.cp67.run_id' "$ledger")" = 40381277165
          test "$(jq -r '.final_gates.cp68.run_id' "$ledger")" = 40383613518
          test "$(jq -r '.final_gates.cp69.run_id' "$ledger")" = 40383707509
          if grep -En '\b(sorry|admit|axiom|unsafe)\b' "$spec"; then
            echo 'Forbidden proof/trust token found.' >&2
            exit 2
          fi
      - name: Verify final predecessor runs and artifacts through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          api=https://api.github.com/repos/${GITHUB_REPOSITORY}
          ledger=formal/family171/CP70_GITHUB_COMPLETION.json
          for cp in cp67 cp68 cp69; do
            run_id=$(jq -r ".final_gates.${cp}.run_id" "$ledger")
            artifact_id=$(jq -r ".final_gates.${cp}.artifact_id" "$ledger")
            expected_digest=$(jq -r ".final_gates.${cp}.artifact_digest" "$ledger")
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api/actions/runs/$run_id" > "cp70_receipt/${cp}_run.json"
            test "$(jq -r '.status' "cp70_receipt/${cp}_run.json")" = completed
            test "$(jq -r '.conclusion' "cp70_receipt/${cp}_run.json")" = success
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api/actions/artifacts/$artifact_id" > "cp70_receipt/${cp}_artifact.json"
            test "$(jq -r '.expired' "cp70_receipt/${cp}_artifact.json")" = false
            test "$(jq -r '.digest' "cp70_receipt/${cp}_artifact.json")" = "$expected_digest"
          done
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/pulls?state=open&head=Ceronio:cmis-family171-cp66-cp70-formal-target&per_page=100" \
            > cp70_receipt/open_pull_requests.json
          test "$(jq 'length' cp70_receipt/open_pull_requests.json)" = 0
      - name: Seal CP70 release receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          out=Path('cp70_receipt')
          ledger=json.loads(Path('formal/family171/CP70_GITHUB_COMPLETION.json').read_text())
          result={
            'status':'CP70_RELEASE_GATE_PASS',
            'kind':'GITHUB_COMPLETION_AND_ZERO_CREDIT_RELEASE',
            'mathematical_credit':0,
            'positive_target_proved':False,
            'branch_commit':os.environ['GITHUB_SHA'],
            'source_commit':ledger['source_commit'],
            'final_runs':{k:v['run_id'] for k,v in ledger['final_gates'].items()},
            'final_receipts':{k:v['receipt'] for k,v in ledger['final_gates'].items()},
            'open_pull_requests':0,
            'full_proof_obligations_open':True,
            'independent_human_review_complete':False,
          }
          (out/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          (out/'FINAL_STATUS.txt').write_text('CP70_RELEASE_GATE_PASS\n')
          manifest_target=Path('formal/family171/CP70_GITHUB_COMPLETION.json')
          (out/'COMPLETION_LEDGER_SHA256.txt').write_text(hashlib.sha256(manifest_target.read_bytes()).hexdigest()+'\n')
          PY
          (cd cp70_receipt && find . -maxdepth 1 -type f ! -name 99_receipt_sha256.txt -print0 | sort -z | xargs -0 sha256sum > 99_receipt_sha256.txt)
      - name: Upload CP70 release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmis-family171-cp70-release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: cp70_receipt/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Enforce final zero-credit completion status
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat cp70_receipt/FINAL_STATUS.txt)" = CP70_RELEASE_GATE_PASS
          grep -F '"mathematical_credit": 0' cp70_receipt/RESULT.json
          grep -F '"positive_target_proved": false' cp70_receipt/RESULT.json
          grep -F '"open_pull_requests": 0' cp70_receipt/RESULT.json
          grep -F '"full_proof_obligations_open": true' cp70_receipt/RESULT.json
